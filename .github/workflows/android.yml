name: Compilar APK y Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Recuperar la llave de firma (guardada como secreto)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta el secreto KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > tv/debug.keystore

      - name: Ajustes para Android TV
        run: python3 tv/patch_android.py
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Usar siempre la misma firma (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp tv/debug.keystore ~/.android/debug.keystore

      - name: Compilar (con ExoPlayer)
        id: build_exo
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Compilar sin ExoPlayer (red de seguridad si lo anterior falla)
        if: steps.build_exo.outcome == 'failure'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ZAPEO_NO_EXO: "1"
        run: |
          rm -rf android
          npx cap add android
          python3 tv/patch_android.py
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zapeo.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Zapeo ${{ github.run_number }}${{ steps.build_exo.outcome == 'failure' && ' (sin ExoPlayer)' || '' }}
          files: zapeo.apk
          make_latest: true

  windows:
    # Programa para Windows (un solo .exe que no necesita instalación). Se añade a la misma versión que el APK.
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar la aplicación de escritorio
        shell: bash
        run: |
          mkdir desktop
          cp www/index.html www/config.js desktop/
          cat > desktop/main.js <<'EOF'
          // Envoltorio de escritorio para Zapeo.
          // webSecurity desactivado: permite descargar listas y reproducir streams de servidores sin cabeceras CORS.
          const { app, BrowserWindow, Menu } = require("electron");
          const path = require("path");
          app.commandLine.appendSwitch("autoplay-policy", "no-user-gesture-required");
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              backgroundColor: "#0d1218",
              autoHideMenuBar: true,
              title: "Zapeo",
              webPreferences: { webSecurity: false },
            });
            Menu.setApplicationMenu(null);
            win.loadFile(path.join(__dirname, "index.html"));
          }
          app.whenReady().then(() => {
            createWindow();
            app.on("activate", () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });
          app.on("window-all-closed", () => app.quit());
          EOF
          cat > desktop/package.json <<'EOF'
          {
            "name": "zapeo",
            "version": "1.0.0",
            "description": "Zapeo",
            "main": "main.js",
            "author": "Zapeo",
            "devDependencies": {
              "electron": "33.2.1",
              "electron-builder": "25.1.8"
            },
            "build": {
              "appId": "app.zapeo.desktop",
              "productName": "Zapeo",
              "files": ["main.js", "index.html", "config.js"],
              "directories": { "output": "dist" },
              "win": { "target": "portable", "signAndEditExecutable": false },
              "portable": { "artifactName": "Zapeo-Windows.exe" }
            }
          }
          EOF

      - name: Instalar dependencias
        working-directory: desktop
        run: npm install

      - name: Crear el .exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --publish never

      - name: Publicar en la misma versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: desktop/dist/Zapeo-Windows.exe
